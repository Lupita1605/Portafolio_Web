    <body>

        <h1>Ejemplo de Tabla: combinado de filas y columnas</h1>

        <table border = "1">
            <caption>Una tabla de muestra m&aacute;s compleja</caption>

            <thead>

                <!--especificado de celdas en sentido vertical u horizontal-->

                    <!--combina dos filas-->
                    <th rowspan = "2">
                        <img src = "../Imagenes/camello.png" width = "205"
                        height = "167" alt = "Imagen de un camello con una joroba">
                    </th>

                    <!--cpmbina cuatro columnas-->
                    <th colspan = "4">
                        <strong>Comparaci&oacute;n de cam&eacute;lidos</strong><br>
                        Fecha aproximada: 10/2011  
                    </th>
                </tr>
                <tr>
                    <th># jorobas</th>
                    <th>Regi&oacute;n ind&iacute;gena</th>
                    <th>Escupe?</th>
                    <th>Produce lana?</th>
                </tr>
            </thead>      
            </body>
                <tr>
                    <th>Camello (bactrianos)</th>
                    <td>2</td>
                    <td>Africa/Asia</td>
                    <td>S&iacute;</td>
                    <td>S&iacute;</td>
                </tr>
                <tr>
                    <th>Llamas</th>

                    <td>Monta&ntilde;a de los Andes</td>
                    <td>S&iacute;</td>
                    <td>S&iacute;</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
