<!DOCTYPE html>

<!--3.6: Formulario de registro Web con encuesta opcional.
Cree un formulario de registro de un sitio Web para obtener el primer nombre, 
apellido y dirección de correo electrónico de un usuario. Incluya además una 
pregunta de encuesta opcional que pida el año en el que se encuentra el usuario 
en la universidad (por ejemplo, primer año). Coloque la pregunta de encuesta 
opcional en el elemento details que el usuario puede expandir para ver la pregunta.-->

<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 3.6</title>
    </head>

    <body>
        <h2>Bienvenidos al formulario</h2>
        
        <form method="post">
            <p><label>Primer nombre:
                <input type="text" placeholder="Escriba su nombre">
            </label></p>

            <p><label>Apellido:
                <input type="text" placeholder="Escriba su apellido">
            </label></p>

           <p><label>Correo electr&oacute;nico:
                <input type="email" placeholder="nombre@dominio.com">
                </label></p>

            <details>
                <summary>Encuesta opcional (haga clic para expandir)</summary>
                <p>
                    <label>&iquest;En qu&eacute; a&ntilde;o de la universidad se encuentra?
                        <input type="text" placeholder="Ej. Primer a&ntilde;o" />
                    </label>
                </p>
            </details>

            <p>
                <input type="submit" value="Enviar" />
                <input type="reset" value="Borrar" />
            </p>

        </form>   
    </body>
</html>
