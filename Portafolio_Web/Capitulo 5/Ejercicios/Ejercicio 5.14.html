<!DOCTYPE html>
<!--5.14 (Transformación con :hover) Cree un programa de transformación que incluya cuatro imágenes. 
Cuando el usuario pase el ratón sobre una imagen, el tamaño de ésta debe aumentar por 20%.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.14 - Transformaci&oacute;n con :hover</title>
        <style type="text/css">
            img {
                width: 150px;
                margin: 10px;
                transition: transform 0.3s;
            }

            img:hover {
                transform: scale(1.2);
            }
        </style>
    </head>
    <body>
        <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios </a></p>

        <img src="../Imagenes/Imagen1.png" alt="Imagen 1">
        <img src="../Imagenes/Imagen2.png" alt="Imagen 2">
        <img src="../Imagenes/Imagen3.png" alt="Imagen 3">
        <img src="../Imagenes/Imagen4.png" alt="Imagen 4">
    </body>
</html>
