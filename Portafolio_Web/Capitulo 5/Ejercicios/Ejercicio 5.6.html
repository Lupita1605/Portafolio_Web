<!DOCTYPE html>
<!--5.6 (Sombra de caja) Cree tres elementos div de diversos colores, cada uno con un valor de width y height de 200px.
En la primera caja agregue una box-shadow dimgrey con un desplazamiento horizontal de 15px, un desplazamiento
vertical de 15px y un radio de desenfoque de 20px. En la segunda caja agregue una box-shadow dimgrey
con un desplazamiento horizontal de -15px, un desplazamiento vertical de -15px y un radio de desenfoque
de 30px. En la tercera caja agregue una box-shadow dimgrey con un desplazamiento horizontal de 15px, un despla-
zamiento vertical de 15px y un radio de desenfoque de 10px.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.6</title>
        <style type="text/css">
            div {
                width: 200px;
                height: 200px;
                margin-bottom: 30px;
            }

            .caja1 {
                background-color: lightcoral;
                box-shadow: 15px 15px 20px dimgrey;
            }

            .caja2 {
                background-color: lightblue;
                box-shadow: -15px -15px 30px dimgrey;
            }

            .caja3 {
                background-color: lightgreen;
                box-shadow: 15px 15px 10px dimgrey;
            }
        </style>
    </head>
    <body>
        <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios </a></p>

        <div class="caja1">Caja 1</div>
        <div class="caja2">Caja 2</div>
        <div class="caja3">Caja 3</div>
    </body>
</html>
