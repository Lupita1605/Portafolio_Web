<!DOCTYPE html>
<!--5.5 (Esquinas redondeadas) Cree tres elementos div, cada uno con valores de width y height de 100px. 
En el primer elemento cree esquinas ligeramente redondeadas, usando un valor de border de 3px black 
y un valor de border-radius de 10px. En el segundo elemento use un valor de border de 3px black y 
aumente el valor de border-radius a 50px. En el tercero use un valor de border de 3px black y aumente 
el valor de border-radius a 100px. Asigne a la propiedad background-color de cada elemento un color 
distinto de su elección. Dentro de cada elemento, muestre el valor de border-radius en texto en negrita.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.5</title>
        <style type="text/css">
            div {
                width: 100px;
                height: 100px;
                border: 3px solid black;
                margin-bottom: 10px;
            }

            .div1 {
                border-radius: 10px;
                background-color: coral;
            }

            .div2 {
                border-radius: 50px;
                background-color: lightgreen;
            }

            .div3 {
                border-radius: 100px;
                background-color: skyblue;
            }
        </style>
    </head>
    <body>
        <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios </a></p>

        <div class="div1">
            <strong>border-radius: 10px</strong>
        </div>

        <div class="div2">
            <strong>border-radius: 50px</strong>
        </div>

        <div class="div3">
            <strong>border-radius: 100px</strong>
        </div>
    </body>
</html
