<!DOCTYPE html>
<!--5.9 (Animación) Cree una animación infinita de un elemento que se mueva en un patrón cuadrado.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.9</title>
        <style type="text/css">
            div {
                width: 100px;
                height: 100px;
                background-color: crimson;
                position: relative;
                animation: moverCuadrado 4s infinite;
            }

            @keyframes moverCuadrado {
                0%   { top: 0px; left: 0px; }
                25%  { top: 0px; left: 200px; }
                50%  { top: 200px; left: 200px; }
                75%  { top: 200px; left: 0px; }
                100% { top: 0px; left: 0px; }
            }
        </style>
    </head>
    <body>
        <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios </a></p>

        <div></div>
    </body>
</html>
