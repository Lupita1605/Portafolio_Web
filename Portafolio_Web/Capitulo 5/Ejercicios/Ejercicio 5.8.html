<!DOCTYPE html>
<!--5.8 (Gradiente radial) Cree un elemento div con una anchura (width) y altura (height) de 500px. 
Cree un gradiente radial con tres colores. Inicie el gradiente en la esquina inferior izquierda 
de modo que los colores vayan cambiando al avanzar a lo largo de la línea del gradiente a la derecha.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.8</title>
        <style type="text/css">
            div {
                width: 500px;
                height: 500px;
                background: radial-gradient(at left bottom, red, yellow, blue);
            }
        </style>
    </head>
    <body>
        <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios </a></p>

        <div></div>
    </body>
</html
