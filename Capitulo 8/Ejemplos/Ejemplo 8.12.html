<!--Fig. 8.12: PruebaBreak.html-->
<!--Uso de la instruccion continue en una instruccion for.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Uso de la instrucci&oacute;n continue en una instrucci&oacute;n for</title>
        <script>

            for (var cuenta = 1; cuenta <= 10; ++cuenta)
            {
                if (cuenta == 5)
                    continue; // Omite el resto del codigo del ciclo solo si cuenta == 5 

                document.writeln( cuenta + " ")
            } // fin de for

            document.writeln(
                "<p>Se Us&oacute; continue para no imprimir el 5</p>");

        </script>
        
    </head><body></body>
</html>
