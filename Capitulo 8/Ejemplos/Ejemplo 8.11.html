<!--Fig. 8.11: PruebaBreak.html-->
<!--Uso de la instruccion break en una i=nstruccion for.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Uso de la instrucci&oacute;n break en una instrucci&oacute;n for</title>
        <script>

            for (var cuenta = 1; cuenta <= 10; ++cuenta)
            {
                if (cuenta == 5)
                    break;

                document.writeln( cuenta + " ")
            } // fin de for

            document.writeln(
                "<p>Se interrumpio&oacute; el ciclo en cuenta = " + cuenta + "</p>");
            

        </script>
    </head><body></body>
</html>
