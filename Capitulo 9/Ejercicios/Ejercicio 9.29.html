<!DOCTYPE html>

<!-- Ejercicio 9.29 -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.29</title>
      <script>
         function iniciar()
         {
            document.getElementById("btnCalcular").onclick = calcular;
         }

         function potencia(base, exponente)
         {
            if (exponente === 1)
            {
               return base;
            }
            return base * potencia(base, exponente - 1);
         }

         function calcular()
         {
            var b = parseInt(document.getElementById("base").value);
            var e = parseInt(document.getElementById("exponente").value);
            var res = document.getElementById("resultado");

            if (isNaN(b) || isNaN(e) || e < 1)
            {
               res.innerHTML = "Por favor, ingrese un exponente entero mayor o igual a 1.";
               return;
            }

            res.innerHTML = b + "<sup>" + e + "</sup> = " + potencia(b, e);
         }

         window.onload = iniciar;
      </script>
   </head>
   <body>
      <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios</a></p>
      <h2>Ejercicios</h2>

      <p><strong>9.29</strong> Potencia recursiva.</p>

      <form action="#">
         <p>
            <label>Base: <input id="base" type="text"></label>
         </p>
         <p>
            <label>Exponente (&ge; 1): <input id="exponente" type="text"></label>
         </p>
         <p>
            <input id="btnCalcular" type="button" value="Calcular potencia">
         </p>
      </form>

      <p id="resultado"></p>
   </body>
</html>
