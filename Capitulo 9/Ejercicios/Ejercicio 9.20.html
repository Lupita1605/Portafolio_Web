<!DOCTYPE html>

<!-- Ejercicio 9.20 -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.20</title>
      <script>
         function iniciar()
         {
            var boton = document.getElementById("botonCalcular");
            boton.addEventListener("click", calcular, false);
         }

         function calcular()
         {
            var promedio = parseFloat(document.getElementById("campoPromedio").value);
            var resultado = document.getElementById("resultado");

            if (!isNaN(promedio) && promedio >= 0 && promedio <= 100)
            {
               resultado.innerHTML = "Puntos de calidad: " + puntosCalidad(promedio);
            }
            else
            {
               resultado.innerHTML = "Por favor, ingrese un promedio v&aacute;lido entre 0 y 100.";
            }
         }

         function puntosCalidad(promedio)
         {
            if (promedio >= 90)
            {
               return 4;
            }
            else if (promedio >= 80)
            {
               return 3;
            }
            else if (promedio >= 70)
            {
               return 2;
            }
            else if (promedio >= 60)
            {
               return 1;
            }
            else
            {
               return 0;
            }
         }

         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios</a></p>
      <h2>Ejercicios</h2>

      <p><strong>9.20</strong> Puntos de calidad seg&uacute;n el promedio del estudiante.</p>

      <form action="#">
         <p>
            <label>Promedio del estudiante:
               <input id="campoPromedio" type="text">
            </label>
         </p>
         <p>
            <input id="botonCalcular" type="button" value="Calcular puntos">
         </p>
      </form>

      <p id="resultado"></p>
   </body>
</html>
