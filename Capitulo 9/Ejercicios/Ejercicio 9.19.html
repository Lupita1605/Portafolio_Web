<!DOCTYPE html>

<!-- Ejercicio 9.19 -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.19</title>
      <script>
         function iniciar()
         {
            var boton = document.getElementById("botonCalcular");
            boton.addEventListener("click", calcularPrimos, false);
         }

         function esPrimo(n)
         {
            if (n <= 1)
            {
               return false;
            }

            var limite = Math.floor(Math.sqrt(n));

            for (var i = 2; i <= limite; ++i)
            {
               if (n % i === 0)
               {
                  return false;
               }
            }

            return true;
         }

         function calcularPrimos()
         {
            var salida = "";

            for (var n = 1; n <= 10000; ++n)
            {
               if (esPrimo(n))
               {
                  salida += n + ", ";
               }
            }

            document.getElementById("resultado").innerHTML = salida;
         }

         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios</a></p>
      <h2>Ejercicios</h2>

      <p><strong>9.19</strong> N&uacute;meros primos entre 1 y 10,000.</p>

      <form action="#">
         <p>
            <input id="botonCalcular" type="button" value="Mostrar primos">
         </p>
      </form>

      <p id="resultado"></p>
   </body>
</html>
