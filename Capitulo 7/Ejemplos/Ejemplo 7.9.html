<!--Fig. 7.9: promedio2.html-->
<!--Repeticion controlada por centinela para calcular el promedio de una clase.-->

<html>
    <head>
        <meta charset ="utf-8">
        <title>Programa del promedio de una clase: repetición controlada por centinela</title>
        <script>

            var total; //suma de calificaiones
            var contadorCalificaciones; //numero de calificaciones introducidas
            var calificacion; //calificacion escrita por el usuario (como una cadena)
            var valorCalificacion; //valor de la calificacion (convertido en entero)
            var promedio; //promedio de todas las calificaciones

            //Fase de inicialización
            total = 0; //inicializa la suma de calificaciones
            contadorCalificaciones = 0; //inicializa el contador de calificaciones

            //Fase de procesamiento
            //pedirla entrada y leer la calificacion del usuario
            calificacion = prompt("Escriba la calificación o -1 para salir: ");

            //convertir calificacion de cadena a entero
            valorCalificacion = parseInt(calificacion);

            while(valorCalificacion != -1)
           {
            //sumar valorCalificacion al total
            total = total + valorCalificacion;

            //sumar 1 al contadorCalificaciones
            contadorCalificaciones = contadorCalificaciones + 1;

            //pedir la entrada y leer la calificacion del usuario
            calificacion = window.prompt(
                "Escriba la calificación entera, -1 para salir:", "0");

            //convertir calificacion de cadena en entero
            valorCalificacion = parseInt(calificacion);
        } //fin de while

        //Fase de terminación
        if(contadorCalificaciones != 0)
        {
            promedio = total / contadorCalificaciones;

            //mostrar el promedio de las calificaciones de los examenes
            document.write("<h1>Promedio de la clase es " + promedio +  "</h1>");

        } // fin de if

        else
            document.writeln("<p>No se introdujeron calificaciones<p>" );
       
        </script>
    </head><body></body>
</html>
