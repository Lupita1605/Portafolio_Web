<!-- Ejercicio 7.5 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Sumar los enteros del 1 al 10</title>
        <script>
            var suma;
            var x;

            x = 1;
            suma = 0;

            while ( x <= 10 )
            {
                suma += x;
                ++x;
            }

            document.writeln( "La suma es: " + suma );
        </script>
    </head>
    <body></body>
</html>
