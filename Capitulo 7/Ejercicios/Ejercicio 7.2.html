        <h2>Ejercicios de autoevaluaci&oacute;n</h2>

        <p><strong>7.2</strong> Escriba cuatro instrucciones de JavaScript que sumen 1, cada una, a la variable x, que contiene un n&uacute;mero.</p>

        <p><strong>Soluci&oacute;n:</strong></p>
        <p><strong>x = x + 1;</strong></p>
        <p><strong>x += 1;</strong></p>
        <p><strong>++x;</strong></p>
        <p><strong>x++;</strong></p>
    </body>
