<!DOCTYPE html>

<!-- Fig. Ejercicio 11.11 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 11.11</title>
      <script>
         function invertirTokens()
         {
            var entrada = document.getElementById( "campoTexto" ).value.trim();

            if ( entrada === "" )
            {
               alert( "Por favor, introduzca una l&iacute;nea de texto." );
               return;
            }

            // Dividir la cadena en tokens usando los espacios como delimitador
            var tokens = entrada.split( " " );

            // Invertir el orden del arreglo de tokens
            var tokensInvertidos = tokens.reverse();

            // Unir los tokens invertidos separados por espacios
            var resultado = tokensInvertidos.join( " " );

            document.getElementById( "resultado" ).innerHTML = "<p><strong>Texto en orden inverso:</strong><br>" + resultado + "</p>";
         }

         function iniciar()
         {
            var boton = document.getElementById( "botonInvertir" );
            boton.addEventListener( "click", invertirTokens, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios</a></p>

      <h2>Ejercicios</h2>
      <p><strong>11.11</strong> Escriba una secuencia de comandos que reciba como entrada una l&iacute;nea de texto, que divida la l&iacute;nea en tokens mediante el m&eacute;todo split de String y que muestre los tokens en orden inverso.</p>

      <form action = "#">
         <p>
            Introduzca una l&iacute;nea de texto:<br>
            <input id = "campoTexto" type = "text" size = "60">
            <input id = "botonInvertir" type = "button" value = "Invertir tokens">
         </p>
      </form>

      <div id = "resultado"></div>
   </body>
</html>
