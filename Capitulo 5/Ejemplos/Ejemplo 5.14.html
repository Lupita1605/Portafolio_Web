<!DOCTYPE html>

<!-- Fig. 5.14: fusionarimagenes.html -->
<!-- Fusionar una imagen en otra mediante CSS3. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Fusi&oacute;n de im&aacute;genes</title>
        <style type = "text/css">
            #portada
            {
                position: relative;
                margin: 0 auto;
            }
            #portada img
            {
                position: absolute;
                left: 0;
                -webkit-transition: opacity 4s ease-in-out;
                transition: opacity 4s ease-in-out;
            }
            #portada img.top:hover
                { opacity:0; }
        </style>
    </head>
    <body>
        <p><a href="../Menu/menu_ejemplos.html">&larr; Regresar al men&uacute; de ejemplos </a></p>

        <div id= "portada">
            <img class = "bottom" src = "../Imagenes/Portada.png" alt = "Portada de Java 9e">
            <img class = "top" src = "../Imagenes/Portada1.png" alt = "Portada de Java 8e">
        </div>
    </body>
</html>
