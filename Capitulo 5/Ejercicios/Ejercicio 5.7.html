<!DOCTYPE html>
<!--5.7 (Gradiente lineal) Cree un elemento div con una anchura (width) y altura (height) de 500px.

<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.7</title>

            div {
                width: 500px;
                height: 500px;
                background: linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet);            }
        </style>
    </head>
    <body>
        <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios </a></p>
