<!DOCTYPE html>
<!--5.11 (Fusionar imágenes) Modifique el ejemplo de la figura 5.14 utilizando cinco imágenes.

idades o en un paisaje en distintos momentos.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.11 - Fusi&oacute;n de 5 im&aacute;genes</title>
        <style type="text/css">
            #portada {
                position: relative;
                margin: 0 auto;
            }

            #portada img {

                transition: opacity 2s ease-in-out;
            }

            #portada img:hover {
                opacity: 0;
            }

    </head>

</html>
