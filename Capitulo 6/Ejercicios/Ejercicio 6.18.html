    <body> 
        <p><a href="../Menu/menu_ejercicios.html">&larr; Regresar al men&uacute; de ejercicios</a></p>
        <h2>Ejercicios</h2>

        <p><strong>6.18</strong> Escriba una secuencia de comandos que reciba tres enteros del usuario y muestre la suma, promedio, producto, menor y mayor de los n&uacute;meros en un di&aacute;logo alert.</p>

        <script>
            var primerNumero;
            var segundoNumero;  
            var tercerNumero;

            primerNumero = window.prompt("Escriba el primer número entero: ");
            segundoNumero = window.prompt("Escriba el segundo número entero: ");
            tercerNumero = window.prompt("Escriba el tercer número entero: ");
            
            primerNumero = parseInt(primerNumero);
            segundoNumero = parseInt(segundoNumero);    
            tercerNumero = parseInt(tercerNumero);

            var suma = primerNumero + segundoNumero + tercerNumero;
            var promedio = suma / 3;    
            var producto = primerNumero * segundoNumero * tercerNumero;
            var menor = Math.min(primerNumero, segundoNumero, tercerNumero);
            var mayor = Math.max(primerNumero, segundoNumero, tercerNumero);

            window.alert("La suma es: " + suma + "\n" +
                         "El promedio es: " + promedio + "\n" +
                         "El producto es: " + producto + "\n" +
                         "El menor es: " + menor + "\n" +
                         "El mayor es: " + mayor);
        </script>
    </body>
</html>
